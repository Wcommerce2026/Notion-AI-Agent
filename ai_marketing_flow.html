<text x="50" y="925" style="font-size:12px;fill:rgb(250,249,245);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:500;">1. Human Approval Gate</text>
<text x="50" y="943" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Triggers: After Creative Director approves final creative</text>
<text x="50" y="959" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Human reviews: Quality, brand alignment, messaging</text>
<text x="50" y="975" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Decision required: Approve OR Disapprove + written feedback</text>

<text x="50" y="1005" style="font-size:12px;fill:rgb(250,249,245);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:500;">2. First Disapproval (Count = 1)</text>
<text x="50" y="1023" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Human provides: Specific feedback on what needs fixing</text>
<text x="50" y="1039" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• System action: Creative Director receives feedback</text>
<text x="50" y="1055" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Rework: Entire creative pipeline re-executes with feedback</text>
<text x="50" y="1071" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Re-submission: Revised creative returns to Human Approval Gate</text>

<text x="50" y="1101" style="font-size:12px;fill:rgb(250,249,245);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:500;">3. Second Disapproval (Count = 2) → SKIP</text>
<text x="50" y="1119" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Slot marked: Content calendar slot for that day/time = EMPTY</text>
<text x="50" y="1135" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• No retry: System does NOT attempt 3rd revision</text>
<text x="50" y="1151" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Move on: Content Strategist proceeds to next scheduled brief</text>
<text x="50" y="1167" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Post-mortem: Conflict Solver logs failure reason for learning</text>

<text x="50" y="1197" style="font-size:12px;fill:rgb(250,249,245);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:500;">4. Approval Path</text>
<text x="50" y="1215" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Human approves → Creative immediately scheduled for posting</text>
<text x="50" y="1231" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Content Scheduler: Takes approved creative, posts at scheduled time</text>
<text x="50" y="1247" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Tracking: Post performance data flows back to Performance Analyst</text>

<text x="50" y="1277" style="font-size:12px;fill:rgb(250,249,245);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:500;">5. Feedback Documentation Requirements</text>
<text x="50" y="1295" style="fill:rgb(194,192,182);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;">• Format: Structured JSON with {reason, specific_issues, suggestions}</text>
